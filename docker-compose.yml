# 一行指令啟動 MySQL＋API：docker compose up --build
# 密碼從 .env 讀取（複製 .env.example 後填入），不寫死在檔案裡
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?請先在 .env 設定 DB_PASSWORD}
      MYSQL_DATABASE: ris
      TZ: Asia/Taipei
    ports:
      - "3307:3306"   # 用 3307，避免和本機已安裝的 MySQL（3306）衝突
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:      # 等 MySQL 真的可以連線，API 才啟動
      # 用 127.0.0.1（TCP）而不是 localhost（socket）：MySQL 第一次初始化時會先開一個
      # 只接受 socket 的暫時服務，用 socket 檢查會太早判定「已就緒」
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    environment:
      # allowPublicKeyRetrieval：MySQL 8 預設的 caching_sha2_password 驗證在未加密連線時需要（僅限本機開發）
      DB_URL: jdbc:mysql://db:3306/ris?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure   # 保險：萬一啟動時資料庫還沒好，自動重試

volumes:
  db-data:
