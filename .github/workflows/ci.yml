# 每次 push／Pull Request 自動編譯並執行測試（H2 記憶體資料庫，不需要 MySQL）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: 編譯＋測試
        run: mvn -B verify
